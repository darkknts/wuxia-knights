<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무협기사단 - 캐릭터 시스템</title>
<link rel="stylesheet" href="./css/style.css">
<style>
.preview{width:min(92vw,900px);margin:24px auto;padding:32px;background:#181818;border:2px solid #6c5634}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{padding:24px;text-align:center;background:#24201b;border:1px solid #6c5634}
.sprite{width:192px;height:192px;image-rendering:pixelated;background:repeating-conic-gradient(#302d29 0 25%,#24221f 0 50%) 0/24px 24px;margin:16px auto}
.sprite img{width:100%;height:100%;image-rendering:pixelated}
.layers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.layers span{padding:5px 8px;border:1px solid #6c5634;font-size:12px;color:#c9c1b2}
.note{color:#9fa596;line-height:1.7}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="preview">
<p class="eyebrow">STEP 2-1 · BASE CHARACTER</p>
<h1>기본 캐릭터 바디</h1>
<p class="note">남성/여성 바디를 독립적으로 두고 동일한 64×64 좌표계 위에 장비 레이어를 조합합니다.</p>
<div class="grid">
<section class="card">
<h2>남성 기본 바디</h2>
<div class="sprite"><img src="./assets/characters/male/male-base.svg"></div>
<p class="note">머리 50% · 몸 30% · 하체 20%</p>
<div class="layers"><span>BODY</span><span>FACE</span><span>HAIR</span><span>EQUIPMENT</span></div>
</section>
<section class="card">
<h2>여성 기본 바디</h2>
<div class="sprite"><img src="./assets/characters/female/female-base.svg"></div>
<p class="note">머리 50% · 몸 30% · 하체 20%</p>
<div class="layers"><span>BODY</span><span>FACE</span><span>HAIR</span><span>EQUIPMENT</span></div>
</section>
</div>
</main>
</body>
</html>
