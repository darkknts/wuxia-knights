<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무협기사단 · 몬스터 1차</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0d0b;color:#f4ead8;font-family:system-ui,"Noto Sans KR",sans-serif}main{width:min(1000px,94vw);margin:32px auto}.head{text-align:center;margin-bottom:28px}.head h1{margin:0 0 8px}.head p{color:#b9aa92}.group{margin:0 0 28px}.group h2{font-size:18px;color:#d6ad62;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#191613;border:1px solid #5c4a2f;border-radius:8px;padding:14px;text-align:center}.stage{height:230px;display:grid;place-items:center;background:radial-gradient(circle,#3a3024,#151310 70%);border-radius:6px}.stage img{width:192px;height:258px;image-rendering:pixelated}.name{margin-top:10px;font-weight:700}.meta{color:#bda57d;font-size:13px;margin-top:4px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<div class="head"><h1>몬스터 1차 캐릭터</h1><p>무협기사단 초반 지역용 · 동양/서양 4종</p></div>
<div class="group"><h2>동양</h2><div class="grid" id="east"></div></div>
<div class="group"><h2>서양</h2><div class="grid" id="west"></div></div>
</main>
<script>
const monsters=[
 ["산적","동양","east-bandit.svg","근접 · Lv.1"],
 ["여우령","동양","east_fox_spirit.svg","마법 · Lv.2"],
 ["고블린","서양","west_goblin.svg","근접 · Lv.1"],
 ["스켈레톤","서양","west_skeleton.svg","근접 · Lv.2"]
];
for(const [name,faction,file,meta] of monsters){
 const c=document.createElement("article");c.className="card";
 c.innerHTML='<div class="stage"><img src="./assets/monsters/'+file+'?v=1" alt="'+name+'"></div><div class="name">'+name+'</div><div class="meta">'+meta+'</div>';
 document.getElementById(faction==="동양"?"east":"west").appendChild(c);
}
</script></body></html>
