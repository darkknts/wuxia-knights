<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무협기사단 · 캐릭터 & 몬스터 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0d0b;color:#f4ead8;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{width:min(1100px,94vw);margin:28px auto}.head{text-align:center;margin-bottom:22px}.head h1{margin:0 0 8px}.head p{color:#b9aa92}.battle{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#191613;border:1px solid #5c4a2f;border-radius:8px;padding:18px}.panel h2{margin:0 0 12px;text-align:center}.stage{height:360px;display:grid;place-items:center;background:radial-gradient(circle,#3a3024,#151310 72%);border-radius:6px;position:relative;overflow:hidden}.stage:after{content:"";position:absolute;bottom:44px;width:190px;height:18px;border-radius:50%;background:#0008;filter:blur(6px)}.sprite{position:relative;width:256px;height:256px;image-rendering:pixelated;z-index:2}.monster{width:192px;height:258px;image-rendering:pixelated;image-rendering:crisp-edges}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}button{padding:10px;border:1px solid #765d36;background:#2b241a;color:#f4ead8;border-radius:5px;cursor:pointer}.status{color:#b9aa92;font-size:13px;text-align:center;margin-top:12px;min-height:20px}@media(max-width:720px){.battle{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><h1>캐릭터 & 몬스터 전투 테스트</h1><p>확정 캐릭터 8종 + 신규 몬스터 4종</p></div><div class="battle"><section class="panel"><h2>플레이어</h2><div class="stage"><div class="sprite" id="hero"></div></div><div class="controls" id="heroControls"></div><div class="status" id="heroStatus">캐릭터 선택</div></section><section class="panel"><h2>몬스터</h2><div class="stage"><img id="monster" class="monster" alt="monster"></div><div class="controls" id="monsterControls"></div><div class="status" id="monsterStatus">몬스터 선택</div></section></div></main><script type="module">import{playCharacterAnimation}from"./js/character/character-animation.js";import{playJobAttack}from"./js/character/job-attack-animation.js";import{playCharacterReaction}from"./js/character/character-reaction.js";import{playMonsterAnimation}from"./js/monster/monster-animation.js";const jobs=[["남성 무사","east_warrior",0],["여성 무사","east_warrior",1],["남성 궁수","east_archer",2],["여성 궁수","east_archer",3],["남성 기사","west_knight",4],["여성 기사","west_knight",5],["남성 아처","west_archer",6],["여성 아처","west_archer",7]],monsters=[["늑대","east-wolf.png"],["산적","east-bandit.png"],["해골병사","west-skeleton-fixed.svg"],["고블린","west-goblin.png"]],hero=document.getElementById("hero"),monster=document.getElementById("monster"),hc=document.getElementById("heroControls"),mc=document.getElementById("monsterControls");let jobId="east_warrior";function heroPick(j){jobId=j[1];hero.innerHTML="";const c=document.createElement("div");c.style.cssText='width:256px;height:256px;background-image:url("./assets/characters/reference/wuxia-knights-8.svg?v=final");background-size:2048px 256px;background-repeat:no-repeat;image-rendering:pixelated;background-position:-'+j[2]*256+'px 0';hero.appendChild(c);document.getElementById("heroStatus").textContent=j[0]+" 선택"}jobs.forEach(j=>{const b=document.createElement("button");b.textContent=j[0];b.onclick=()=>heroPick(j);hc.appendChild(b)});function monsterPick(m){monster.style.opacity="1";monster.style.transform="";monster.src="./assets/monsters/"+m[1]+"?v=20261008-monsters";document.getElementById("monsterStatus").textContent=m[0]+" 선택"}monsters.forEach(m=>{const b=document.createElement("button");b.textContent=m[0];b.onclick=()=>monsterPick(m);mc.appendChild(b)});[["대기",()=>playMonsterAnimation(monster,"idle")],["이동",()=>playMonsterAnimation(monster,"walk")],["공격",()=>playMonsterAnimation(monster,"attack",()=>document.getElementById("monsterStatus").textContent="몬스터 공격")],["피격",()=>playMonsterAnimation(monster,"hit",()=>document.getElementById("monsterStatus").textContent="몬스터 피격")],["사망",()=>playMonsterAnimation(monster,"death",()=>document.getElementById("monsterStatus").textContent="몬스터 사망")],["부활",()=>playMonsterAnimation(monster,"respawn",()=>document.getElementById("monsterStatus").textContent="몬스터 부활")]].forEach(([n,fn])=>{const b=document.createElement("button");b.textContent=n;b.onclick=fn;mc.appendChild(b)});[["대기",()=>playCharacterAnimation(hero,"idle")],["공격",()=>playJobAttack(hero,jobId,()=>document.getElementById("heroStatus").textContent="공격 적중")],["피격",()=>playCharacterReaction(hero,"hit",()=>document.getElementById("heroStatus").textContent="피격")],["사망",()=>playCharacterReaction(hero,"death",()=>document.getElementById("heroStatus").textContent="사망")]].forEach(([n,fn])=>{const b=document.createElement("button");b.textContent=n;b.onclick=fn;hc.appendChild(b)});monsterPick(monsters[0]);heroPick(jobs[0]);</script></body></html>
