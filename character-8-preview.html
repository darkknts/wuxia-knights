<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무협기사단 · 8종 캐릭터 조합</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e0d0b;color:#f4ead8;font-family:system-ui,"Noto Sans KR",sans-serif}
main{width:min(1100px,94vw);margin:32px auto}
.head{text-align:center;margin-bottom:28px}.head h1{margin:0 0 8px}.head p{color:#b9aa92}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#191613;border:1px solid #5c4a2f;border-radius:8px;padding:14px;text-align:center}
.stage{height:250px;display:grid;place-items:center;background:radial-gradient(circle,#3a3024,#151310 70%);border-radius:6px;position:relative;overflow:hidden}
.stage img{width:192px;height:258px;image-rendering:pixelated;object-fit:fill}
.name{margin-top:12px;font-weight:700}.meta{color:#bda57d;font-size:13px;margin-top:4px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="head"><h1>무협기사단 8종 캐릭터 조합</h1><p>기존 기획 이미지 기준 · 남/여 × 무사 · 궁수 · 기사 · 아처</p></div>
<div class="grid" id="grid"></div>
</main>
<script>
const base="./assets/characters/reference/";
const jobs=[
 ["무사","동양","male-warrior.svg","female-warrior.svg"],
 ["궁수","동양","male-archer.svg","female-archer.svg"],
 ["기사","서양","male-knight.svg","female-knight.svg"],
 ["아처","서양","male-west-archer.svg","female-west-archer.svg"]
];
const grid=document.getElementById("grid");
jobs.forEach(([job,faction,male,female])=>{
 [["남성",male],["여성",female]].forEach(([gender,file])=>{
   const card=document.createElement("article");card.className="card";
   card.innerHTML='<div class="stage"><img src="'+base+file+'?v=20261008-ref" alt="'+gender+" "+job+'"></div><div class="name">'+gender+" "+job+'</div><div class="meta">'+faction+" · 기존 기획 이미지 기준"+'</div>';
   grid.appendChild(card);
 });
});
</script>
</body>
</html>
