<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무협기사단 · 몬스터 1차</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0d0b;color:#f4ead8;font-family:system-ui,"Noto Sans KR",sans-serif}main{width:min(1000px,94vw);margin:32px auto}.head{text-align:center;margin-bottom:28px}.head h1{margin:0 0 8px}.head p{color:#b9aa92}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#191613;border:1px solid #5c4a2f;border-radius:8px;padding:14px;text-align:center}.stage{height:250px;display:grid;place-items:center;background:radial-gradient(circle,#3a3024,#151310 70%);border-radius:6px}.stage img{width:192px;height:258px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}.name{margin-top:10px;font-weight:700}.meta{color:#bda57d;font-size:13px;margin-top:4px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="head"><h1>몬스터 1차 캐릭터</h1><p>동양 2종 · 서양 2종 · 현재 캐릭터와 동일한 픽셀 스타일</p></div><div class="grid" id="grid"></div></main><script>const monsters=[["늑대","동양","east-wolf.png"],["산적","동양","east-bandit.png"],["해골병사","서양","west-skeleton.png"],["고블린","서양","west-goblin.png"]];const grid=document.getElementById("grid");for(const [name,faction,file] of monsters){const c=document.createElement("article");c.className="card";c.innerHTML='<div class="stage"><img src="./assets/monsters/'+file+'?v=20261008-monsters" alt="'+name+'"></div><div class="name">'+name+'</div><div class="meta">'+faction+" · 초반 몬스터"+'</div>';grid.appendChild(c)}</script></body></html>
