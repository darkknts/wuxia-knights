<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무협기사단 - 캐릭터 애니메이션</title>
<link rel="stylesheet" href="./css/style.css">
<style>
.preview{width:min(94vw,900px);margin:24px auto;padding:28px;background:#181818;border:2px solid #6c5634;text-align:center}
.stage{height:320px;display:grid;place-items:center;background:repeating-conic-gradient(#302d29 0 25%,#24221f 0 50%) 0/48px 48px;border:1px solid #6c5634}
.sprite{position:relative;width:192px;height:192px;image-rendering:pixelated}.sprite img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.controls button{padding:10px 18px}
</style></head>
<body><main class="preview">
<p class="eyebrow">STEP 2-5 · CHARACTER ANIMATION</p><h1>캐릭터 애니메이션</h1>
<p class="subtitle">대기 · 이동 · 기본 공격의 공통 동작을 테스트합니다.</p>
<div class="stage"><div id="sprite" class="sprite"></div></div>
<div class="controls"><button data-animation="idle">대기</button><button data-animation="walk">이동</button><button data-animation="basic_attack">기본 공격</button></div>
<p id="status" class="status">대기</p>
</main>
<script type="module">
import { playCharacterAnimation } from "./js/character/character-animation.js";
const sprite=document.querySelector("#sprite");
["male/male-base","faces/default-male","hair/male-tied","clothes/east-warrior-basic","weapons/azure-dragon-glaive-basic"].forEach(p=>{const i=document.createElement("img");i.src="./assets/characters/"+p+".svg";sprite.appendChild(i)});
document.querySelectorAll("[data-animation]").forEach(b=>b.onclick=()=>{document.querySelector("#status").textContent=b.textContent;playCharacterAnimation(sprite,b.dataset.animation)});
playCharacterAnimation(sprite,"idle");
</script></body></html>
