<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무협기사단 · 몬스터 애니메이션 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0d0b;color:#f4ead8;font-family:system-ui,"Noto Sans KR",sans-serif}main{width:min(1100px,94vw);margin:28px auto}.head{text-align:center;margin-bottom:22px}.head h1{margin:0 0 8px}.head p{color:#b9aa92}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#191613;border:1px solid #5c4a2f;border-radius:8px;padding:14px;text-align:center}.stage{height:230px;display:grid;place-items:center;background:radial-gradient(circle,#3a3024,#151310 70%);border-radius:6px;overflow:hidden}.monster{width:192px;height:258px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}.name{margin:10px 0;font-weight:700}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}button{padding:8px;border:1px solid #765d36;background:#2b241a;color:#f4ead8;border-radius:5px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="head"><h1>몬스터 애니메이션 1차 테스트</h1><p>대기 · 이동 · 공격 · 피격 · 사망 · 부활</p></div><div class="grid" id="grid"></div></main><script type="module">import{playMonsterAnimation}from"./js/monster/monster-animation.js";const list=[["늑대","east-wolf.png"],["산적","east-bandit.png"],["해골병사","west-skeleton-fixed.svg"],["고블린","west-goblin.png"]],grid=document.getElementById("grid");for(const [name,file]of list){const card=document.createElement("article");card.className="card";card.innerHTML='<div class="stage"><img class="monster" src="./assets/monsters/'+file+'?v=anim1" alt="'+name+'"></div><div class="name">'+name+'</div><div class="controls"></div>';const img=card.querySelector("img"),controls=card.querySelector(".controls");[["대기","idle"],["이동","walk"],["공격","attack"],["피격","hit"],["사망","death"],["부활","respawn"]].forEach(([label,type])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>playMonsterAnimation(img,type);controls.appendChild(b)});grid.appendChild(card)}</script></body></html>
