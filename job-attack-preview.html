<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무협기사단 - 직업별 공격</title><link rel="stylesheet" href="./css/style.css"><style>
.preview{width:min(94vw,1000px);margin:24px auto;padding:28px;background:#181818;border:2px solid #6c5634;text-align:center}.stage{height:340px;display:grid;place-items:center;background:repeating-conic-gradient(#302d29 0 25%,#24221f 0 50%) 0/48px 48px;border:1px solid #6c5634}.sprite{position:relative;width:220px;height:220px;image-rendering:pixelated}.sprite img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.choices button{padding:10px 15px}.status{min-height:1.5em}
</style></head><body><main class="preview"><p class="eyebrow">STEP 2-6 · JOB ATTACK</p><h1>직업별 기본 공격</h1><p class="subtitle">직업에 따라 공격 방식과 모션이 달라집니다.</p><div class="choices" id="jobs"></div><div class="stage"><div class="sprite" id="sprite"></div></div><button id="attack">기본 공격</button><p id="status" class="status"></p></main>
<script type="module">
import { playJobAttack } from "./js/character/job-attack-animation.js";
const data={east_warrior:{n:"무사",parts:["male/male-base","faces/default-male","hair/male-tied","clothes/east-warrior-basic","weapons/azure-dragon-glaive-basic"]},east_archer:{n:"궁수",parts:["male/male-base","faces/default-male","hair/male-long","clothes/east-archer-basic","weapons/east-bow-basic"]},west_knight:{n:"기사",parts:["male/male-base","faces/default-male","hair/male-short","clothes/west-knight-basic","shields/knight-shield-basic","weapons/knight-sword-basic"]},west_archer:{n:"아처",parts:["male/male-base","faces/default-male","hair/male-short","clothes/west-archer-basic","weapons/west-bow-basic"]}};
let current="east_warrior";const sprite=document.querySelector("#sprite");
function render(){sprite.innerHTML="";data[current].parts.forEach(p=>{const i=document.createElement("img");i.src="./assets/characters/"+p+".svg";sprite.appendChild(i)});document.querySelector("#status").textContent=data[current].n+" 선택";}
Object.entries(data).forEach(([id,j])=>{const b=document.createElement("button");b.textContent=j.n;b.onclick=()=>{current=id;render()};document.querySelector("#jobs").appendChild(b)});
document.querySelector("#attack").onclick=()=>playJobAttack(sprite,current,e=>document.querySelector("#status").textContent=data[current].n+" 공격 적중 · "+e.effect);
render();
</script></body></html>
